<head>

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Highlight.js para syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">

  <!-- Tema customizado -->
  <link href="/theme/css/style.css" rel="stylesheet">


  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2RH8SQZT43"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2RH8SQZT43');
  </script>
</head>
<body>

<!-- ===== SIDEBAR (espelho do iPortfolio) ===== -->
<header id="sidebar" class="sidebar dark-background d-flex flex-column">
  <i class="sidebar-toggle d-xl-none bi bi-list"></i>

  <div class="profile-img text-center">
    <img src="/theme/img/profile.png" alt="Felipe Sembay" class="img-fluid rounded-circle">
  </div>

  <a href="/" class="logo d-flex align-items-center justify-content-center">
    <h1 class="sitename">Felipe Sembay</h1>
  </a>

  <p class="sidebar-subtitle text-center">Data Scientist &amp; ML Engineer</p>

  <!-- Language switcher (igual ao iPortfolio) -->
  <div class="lang-switcher text-center">
    <a href="/pages/sobre.html" class="lang-btn" data-lang="pt" title="Português">
      <span>🇧🇷</span> PT
    </a>
    <a href="/pages/about.html" class="lang-btn" data-lang="en" title="English">
      <span>🇺🇸</span> EN
    </a>
  </div>

  <div class="social-links text-center">
    <a href="https://github.com/felipesembay" target="_blank" title="GitHub"><i class="bi bi-github"></i></a>
    <a href="https://linkedin.com/in/felipesembay" target="_blank" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
  </div>

  <nav class="navmenu">
    <ul>
      <li><a href="/" class="active">
        <i class="bi bi-journal-text navicon"></i> Blog
      </a></li>
      <li><a href="/pages/sobre.html" >
        <i class="bi bi-person navicon"></i> Sobre
      </a></li>
      <li class="dropdown">
        <a href="#"><i class="bi bi-grid navicon"></i> Categorias <i class="bi bi-chevron-down toggle-dropdown"></i></a>
        <ul>
          <li><a href="/category/data-science.html">Data Science <span class="badge-count">1</span></a></li>
        </ul>
      </li>
      <li><a href="https://felipesembay.github.io/" target="_blank">
        <i class="bi bi-person-badge navicon"></i> Portfólio
      </a></li>
    </ul>
  </nav>
</header>

<!-- ===== CONTEÚDO PRINCIPAL ===== -->
<main class="main">
  <div class="container-fluid px-4 py-5">
    <h2>Tags for Felipe Sembay | Blog</h2>
    <ul>
            <li><a href="/tag/introducao.html">introducao</a> (1)</li>
            <li><a href="/tag/machine-learning.html">machine-learning</a> (1)</li>
            <li><a href="/tag/python.html">python</a> (1)</li>
    </ul>
  </div>
</main>

<!-- ===== FOOTER ===== -->
<footer id="footer" class="footer dark-background">
  <div class="container text-center py-3">
    <small>
      &copy; 2026 <strong>Felipe Sembay</strong> &mdash;
      <a href="https://felipesembay.github.io/" target="_blank">Portfólio</a>
    </small>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  hljs.highlightAll();

  // Lang switcher — marca botão ativo pela URL atual
  (function() {
    const path = window.location.pathname;
    const isEN = path.includes('/about');
    document.querySelectorAll('.lang-btn').forEach(btn => {
      const isActive = (isEN && btn.dataset.lang === 'en') || (!isEN && btn.dataset.lang === 'pt');
      if (isActive) btn.classList.add('active-lang');
    });
  })();

  // Sidebar toggle (mobile)
  const toggle = document.querySelector('.sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  if (toggle) {
    toggle.addEventListener('click', () => sidebar.classList.toggle('sidebar-show'));
  }

  // Dropdown no nav
  document.querySelectorAll('.navmenu .dropdown > a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      a.parentElement.classList.toggle('active');
    });
  });
</script>
</body>
</html>
